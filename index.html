<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Gerador de Recibo - Pantanal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 10px; }
        .recibo-container { background: #fff; max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header-empresa { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 20px; }
        .header-empresa img { max-width: 80px; }
        .tabela-empresa { width: 50%; border-collapse: collapse; font-size: 12px; }
        .tabela-empresa td { border: 1px solid #000; padding: 4px; }
        h3 { text-align: center; margin: 15px 0; }
        .form-group { margin-bottom: 8px; display: flex; align-items: center; }
        .form-group label { font-weight: bold; font-size: 13px; margin-right: 5px; }
        .form-group input { border: none; border-bottom: 1px dotted #000; outline: none; font-size: 13px; width: 100%; padding: 2px; }
        
        .tabela-servicos { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        .tabela-servicos th, .tabela-servicos td { border: 1px solid #000; padding: 6px; text-align: center; vertical-align: middle; }
        .tabela-servicos th { background: #007bff; color: white; }
        
        /* Ajuste das larguras das colunas */
        .tabela-servicos th:first-child { width: 70%; text-align: left; }
        .tabela-servicos th:nth-child(2) { width: 8%; }
        .tabela-servicos th:nth-child(3), .tabela-servicos th:nth-child(4) { width: 11%; }
        
        .tabela-servicos td:first-child { text-align: left; }
        .tabela-servicos input, .tabela-servicos textarea { width: 95%; border: none; text-align: center; outline: none; font-family: inherit; font-size: inherit; background: transparent; }
        
        /* Ajustes específicos para o textarea da descrição para permitir quebra de linha */
        .tabela-servicos td:first-child textarea { 
            text-align: left; 
            resize: none; 
            width: 100%; 
            height: 35px; /* Altura padrão, ajustável conforme necessário */
        }
        
        .botoes { text-align: center; margin-top: 20px; }
        .botoes button { background: #007bff; color: white; border: none; padding: 10px 15px; margin: 5px; border-radius: 5px; font-size: 14px; cursor: pointer; }
    </style>
</head>
